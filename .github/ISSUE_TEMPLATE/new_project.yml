name: Submit a New Project
description: Submit an approved AMP Lab project repository
title: "[new-project]: "
labels:
  - new-project
assignees:
  - daniel-cherkasskiy

body:
  - type: markdown
    attributes:
      value: |
        Submit your approved AMP Lab project repository below.

        Before submitting, make sure you have:
        - Created your repository using the AMP Lab Sample Project template
        - Updated the README.md with your project information
        - Replaced the default hero.png with an image representing your project

  - type: input
    id: project_name
    attributes:
      label: Project Name
      description: Enter the name of your AMP Lab project.
      placeholder: ex. SRAM Teaching Tool
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Project Owner
      description: Enter your full name.
      placeholder: ex. Daniel Cherkasskiy
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Virginia Tech Email
      description: Enter your Virginia Tech email address.
      placeholder: ex. yourpid@vt.edu
    validations:
      required: true

  - type: input
    id: project_url
    attributes:
      label: Project Link
      description: Provide the link to your GitHub project repository.
      placeholder: ex. https://github.com/username/project-name
    validations:
      required: true

  - type: textarea
    id: mission
    attributes:
      label: Project Description
      description: Provide a short description of what your project does. This may be used on the AMP Lab website.
      placeholder: Describe the goal of your project in one or two sentences.
    validations:
      required: true

  - type: checkboxes
    id: requirements
    attributes:
      label: Project Repository Requirements
      description: Confirm that your repository is ready to be submitted.
      options:
        - label: I have updated the README.md with my project information.
          required: true
        - label: I have replaced the default hero.png with an image representing my project.
          required: true
        - label: This project has been reviewed and approved through the AMP Lab Project Proposal process.
          required: true
